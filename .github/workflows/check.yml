name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - name: Validate local connection helpers
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.mjs' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript helper validation failed." }
          }
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $relayTokens = $null
            $relayErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$relayTokens, [ref]$relayErrors) | Out-Null
            if ($relayErrors.Count) { throw "PowerShell helper validation failed: $($_.Name)" }
          }
      - run: npm audit --audit-level=high
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build windows/Relay.Service/Relay.Service.csproj -c Release
